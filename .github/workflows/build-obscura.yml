name: Build Obscura (Android)

# 为 RikkaHub 交叉编译 obscura 无头浏览器（aarch64 / x86_64 Android）。
#
# 不编译 V8 源码：Android 交叉编译下 gn/bindgen 的坑太多（crates.io 的 v8 crate
# 还裁掉了 icudtl.dat、vendor 和部分 v8/tools）。这里直接用 rusty_v8 官方发布的
# 「同架构 Linux 预编译静态库 + 预生成 bindings」：
#   - 静态库是 .o 集合，用 NDK clang 链接进 Android 可执行文件
#   - bindings 描述 V8 的 C++ 接口，LP64 下与 Android ABI 一致
#
# 关键：RUSTY_V8_ARCHIVE / RUSTY_V8_SRC_BINDING_PATH 是全局环境变量，rusty_v8 还会
# 为 host（build script 依赖）再构建一份 v8。若不区分，host 侧会拿到 Android 架构的
# 静态库（rust-lld: incompatible with elf64-x86-64）。所以这里把 crates.io 的 v8 crate
# 复制出来打补丁：让这两个变量只对 android target 生效，host 走默认下载。
#
# 产物：obscura-android-<abi> artifact，含 libobscura.so 与 libc++_shared.so，
# 下载后放进 app/src/main/jniLibs/<abi>/。

on:
  workflow_dispatch:
    inputs:
      obscura_ref:
        description: 'obscura 的 tag / 分支（例如 v0.2.7）'
        required: false
        default: 'v0.2.7'
      features:
        description: 'cargo features（render,stealth / render / 空）'
        required: false
        default: 'render,stealth'
  push:
    paths:
      - '.github/workflows/build-obscura.yml'

permissions:
  contents: read

concurrency:
  group: build-obscura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: obscura ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            linux_arch: aarch64
          - target: x86_64-linux-android
            abi: x86_64
            linux_arch: x86_64

    env:
      OBSCURA_REF: ${{ inputs.obscura_ref || 'v0.2.7' }}
      OBSCURA_FEATURES: ${{ inputs.features || 'render,stealth' }}
      NDK_VERSION: r26d
      ANDROID_API: '24'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev unzip python3 curl git
          # libclang-dev 的库在 /usr/lib/llvm-<ver>/lib；llvm-config 由 llvm-dev 提供
          LIBCLANG_DIR="$(llvm-config --libdir)"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          test -e "$LIBCLANG_DIR/libclang.so"
          clang --version
          cmake --version

      - name: Set up Android NDK
        run: |
          ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL -o "/tmp/${ZIP}" "https://dl.google.com/android/repository/${ZIP}"
          sudo unzip -q "/tmp/${ZIP}" -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check out obscura
        run: |
          git clone --depth=1 --branch "$OBSCURA_REF" https://github.com/h4ckf0r0day/obscura.git obscura
          git -C obscura rev-parse HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ vars.OBSCURA_CACHE_REV || '1' }}

      - name: Prepare prebuilt V8 artifacts
        # deno_core 启用了 simdutf feature，必须用 _simdutf_ 变体的库与 bindings。
        run: |
          set -euo pipefail
          V8_VER=$(awk -F'"' '/^name = "v8"$/{f=1} f&&/^version = /{print $2; exit}' obscura/Cargo.lock)
          echo "v8 crate version: $V8_VER"
          ARCH="${{ matrix.linux_arch }}"
          BASE="https://github.com/denoland/rusty_v8/releases/download/v${V8_VER}"
          LIB="$RUNNER_TEMP/librusty_v8.a.gz"
          BINDINGS="$RUNNER_TEMP/src_binding.rs"
          curl -fL -o "$LIB" "$BASE/librusty_v8_simdutf_release_${ARCH}-unknown-linux-gnu.a.gz"
          curl -fL -o "$BINDINGS" "$BASE/src_binding_simdutf_release_${ARCH}-unknown-linux-gnu.rs"
          ls -lh "$LIB" "$BINDINGS"
          gzip -t "$LIB"
          echo "RUSTY_V8_ARCHIVE=$LIB" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$BINDINGS" >> "$GITHUB_ENV"

      - name: Patch v8 crate to scope prebuilt artifacts to Android
        # 让 RUSTY_V8_ARCHIVE / RUSTY_V8_SRC_BINDING_PATH 只对 android target 生效；
        # host（build script 依赖的 v8）继续走默认的 x86_64 预编译下载。
        run: |
          set -euo pipefail
          cargo fetch --target "${{ matrix.target }}"
          V8_VER=$(awk -F'"' '/^name = "v8"$/{f=1} f&&/^version = /{print $2; exit}' obscura/Cargo.lock)
          SRC=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name "v8-$V8_VER" | head -n1)
          test -n "$SRC"
          PATCHED="$RUNNER_TEMP/v8-patched"
          cp -a "$SRC" "$PATCHED"
          BUILD_RS="$PATCHED/build.rs"
          perl -pi -e 's/if let Ok\(custom_archive\) = env::var\("RUSTY_V8_ARCHIVE"\) \{/if env::var("TARGET").map(|t| t.contains("android")).unwrap_or(false) \&\& env::var("RUSTY_V8_ARCHIVE").is_ok() { let custom_archive = env::var("RUSTY_V8_ARCHIVE").unwrap();/' "$BUILD_RS"
          perl -pi -e 's/if let Ok\(binding\) = env::var\("RUSTY_V8_SRC_BINDING_PATH"\) \{/if env::var("TARGET").map(|t| t.contains("android")).unwrap_or(false) \&\& env::var("RUSTY_V8_SRC_BINDING_PATH").is_ok() { let binding = env::var("RUSTY_V8_SRC_BINDING_PATH").unwrap();/' "$BUILD_RS"
          grep -c 't.contains("android")' "$BUILD_RS"
          cat >> obscura/Cargo.toml <<EOF

          # CI: 用打过补丁的 v8 crate（仅 Android 使用预编译产物）
          [patch.crates-io]
          v8 = { path = "$PATCHED" }
          EOF
          tail -5 obscura/Cargo.toml

      - name: Generate CMake toolchain wrapper
        # btls-sys 调 cmake 时会清掉环境变量，NDK toolchain 读不到 ANDROID_ABI 会回落
        # 到 armeabi-v7a（x86_64 下直接报 -march=armv7-a 不支持）。用包装文件固定 ABI。
        run: |
          TOOLCHAIN="$RUNNER_TEMP/android-${{ matrix.abi }}.cmake"
          cat > "$TOOLCHAIN" <<EOF
          set(ANDROID_ABI "${{ matrix.abi }}" CACHE STRING "")
          set(ANDROID_PLATFORM "android-${ANDROID_API}" CACHE STRING "")
          set(ANDROID_NDK "$ANDROID_NDK_HOME" CACHE PATH "")
          include("$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake")
          EOF
          cat "$TOOLCHAIN"
          echo "CMAKE_TOOLCHAIN_FILE=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Configure cargo linker
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat >> obscura/.cargo/config.toml <<EOF

          [target.${{ matrix.target }}]
          linker = "$NDK_BIN/${{ matrix.target }}${ANDROID_API}-clang"
          # Android 15+ 要求 16 KB 页对齐
          rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
          EOF
          cat obscura/.cargo/config.toml

      - name: Build obscura
        working-directory: obscura
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_PLATFORM: android-24
        run: |
          set -o pipefail
          cargo build \
            --profile release-dist \
            --target "${{ matrix.target }}" \
            -p obscura-cli \
            --bin obscura \
            --features "$OBSCURA_FEATURES" 2>&1 | tee "${GITHUB_WORKSPACE}/build-${{ matrix.abi }}.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.abi }}
          path: build-${{ matrix.abi }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect binary
        run: |
          BIN="obscura/target/${{ matrix.target }}/release-dist/obscura"
          test -f "$BIN"
          file "$BIN"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$BIN"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$BIN" | grep NEEDED || true
          du -h "$BIN"
          mkdir -p "dist/${{ matrix.abi }}"
          cp "$BIN" "dist/${{ matrix.abi }}/libobscura.so"
          chmod 755 "dist/${{ matrix.abi }}/libobscura.so"
          # Rust 的 Android 分支链接的是 c++_shared，运行时需要它
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.target }}/libc++_shared.so" "dist/${{ matrix.abi }}/"
          ls -lh "dist/${{ matrix.abi }}"
          sha256sum "dist/${{ matrix.abi }}"/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
