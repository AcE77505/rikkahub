name: Build Obscura (Android)

# 为 RikkaHub 交叉编译 obscura 无头浏览器（aarch64 / x86_64 Android）。
#
# obscura 内嵌 V8，没有 Android 预编译包，必须在 Linux 主机上用 NDK 从源码编译；
# 这里只负责产出可执行文件，再由 jniLibs 打包进 APK（重命名为 libobscura.so 才能
# 落在 nativeLibraryDir 里被 exec）。x86_64 主机（ubuntu-22.04）交叉编译，
# 不能用 Windows 本机直接编。
#
# 关键点：crates.io 上发布的 v8 crate 是裁剪版（缺 ICU 数据、chromium_crates_io
# vendor、部分 v8/tools 脚本），无法从源码编 V8。这里按 rusty_v8 官方 CI 的做法，
# 把完整的 rusty_v8 仓库（含 V8 子模块）作为 path 依赖 patch 进去。
#
# 产物：obscura-android-arm64-v8a / obscura-android-x86_64 两个 artifact，
# 各含一个 libobscura.so，下载后放进 app/src/main/jniLibs/<abi>/。

on:
  workflow_dispatch:
    inputs:
      obscura_ref:
        description: 'obscura 的 tag / 分支（例如 v0.2.7）'
        required: false
        default: 'v0.2.7'
      features:
        description: 'cargo features（render,stealth / render / 空）'
        required: false
        default: 'render,stealth'
  push:
    paths:
      - '.github/workflows/build-obscura.yml'

permissions:
  contents: read

concurrency:
  group: build-obscura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: obscura ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    # V8 从源码编一次 30–60 分钟，加 BoringSSL 与冷缓存留足余量
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64

    env:
      OBSCURA_REF: ${{ inputs.obscura_ref || 'v0.2.7' }}
      OBSCURA_FEATURES: ${{ inputs.features || 'render,stealth' }}
      # NDK r26d 与 rusty_v8 build.rs 自带的 r26c 对齐，避免两套 sysroot 混用
      NDK_VERSION: r26d
      ANDROID_API: '24'
      # V8 从源码编（Android 没有预编译的 rusty_v8 静态库）
      V8_FROM_SOURCE: '1'
      CARGO_INCREMENTAL: '0'
      # V8 链接阶段吃内存，2 并发是 obscura 官方推荐值
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake unzip python3 curl git
          # bindgen 需要 libclang 21+（rusty_v8 的硬性要求）
          sudo apt-get install -y lld-21 clang-21 libclang-21-dev || {
            echo "llvm-21 not in jammy, adding apt.llvm.org"
            echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-21.list
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg > /dev/null
            sudo apt-get update
            sudo apt-get install -y lld-21 clang-21 libclang-21-dev
          }
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"
          clang --version
          cmake --version
          df -h /

      - name: Set up Android NDK
        run: |
          ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL -o "/tmp/${ZIP}" "https://dl.google.com/android/repository/${ZIP}"
          sudo unzip -q "/tmp/${ZIP}" -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          "/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check out obscura
        run: |
          git clone --depth=1 --branch "$OBSCURA_REF" https://github.com/h4ckf0r0day/obscura.git obscura
          git -C obscura rev-parse HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ vars.OBSCURA_CACHE_REV || '1' }}

      - name: Cache V8 build
        # V8 的编译产物（gn_out）是 cross 编译最耗时的一步；命中后增量构建只需几分钟
        uses: actions/cache@v4
        with:
          path: obscura/target/**/gn_out
          key: v8-${{ matrix.target }}-${{ env.OBSCURA_REF }}-${{ vars.OBSCURA_CACHE_REV || '1' }}

      - name: Fetch full V8 source (rusty_v8 repo)
        # crates.io 的 v8 crate 不完整，源码编译必须用 rust_v8 仓库 + 子模块
        run: |
          set -euo pipefail
          V8_VER=$(awk -F'"' '/^name = "v8"$/{f=1} f&&/^version = /{print $2; exit}' obscura/Cargo.lock)
          echo "v8 crate version: $V8_VER"
          git clone --depth 1 --branch "v$V8_VER" https://github.com/denoland/rusty_v8 "$RUNNER_TEMP/rusty_v8"
          git -C "$RUNNER_TEMP/rusty_v8" submodule update --init --recursive --depth 1
          git -C "$RUNNER_TEMP/rusty_v8" submodule status
          du -sh "$RUNNER_TEMP/rusty_v8"
          df -h /
          cat >> obscura/Cargo.toml <<EOF

          # CI: 用完整源码替换 crates.io 上裁剪过的 v8 crate
          [patch.crates-io]
          v8 = { path = "$RUNNER_TEMP/rusty_v8" }
          EOF
          tail -5 obscura/Cargo.toml

      - name: Configure cargo linker
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat >> obscura/.cargo/config.toml <<EOF

          [target.${{ matrix.target }}]
          linker = "$NDK_BIN/${{ matrix.target }}${ANDROID_API}-clang"
          # Android 15+ 要求 16 KB 页对齐，否则安装/运行会报错
          rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
          EOF
          cat obscura/.cargo/config.toml

      - name: Generate CMake toolchain wrapper
        # boring-sys 调 cmake 时会清掉环境变量，NDK 的 toolchain 读不到 ANDROID_ABI，
        # 会回落到默认的 armeabi-v7a（x86_64 下直接报 -march=armv7-a 不支持）。
        # 这里用包装文件在 include 之前把 ABI / API level 固定下来。
        run: |
          TOOLCHAIN="$RUNNER_TEMP/android-${{ matrix.abi }}.cmake"
          cat > "$TOOLCHAIN" <<EOF
          set(ANDROID_ABI "${{ matrix.abi }}" CACHE STRING "")
          set(ANDROID_PLATFORM "android-${ANDROID_API}" CACHE STRING "")
          set(ANDROID_NDK "$ANDROID_NDK_HOME" CACHE PATH "")
          include("$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake")
          EOF
          cat "$TOOLCHAIN"
          echo "CMAKE_TOOLCHAIN_FILE=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build obscura
        working-directory: obscura
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_PLATFORM: android-24
          # V8 编译本身能过，但 bindgen 生成 Rust 绑定时需要 Android target 与 NDK
          # sysroot，否则 V8 自带的 libc++ 头文件（cstdint 的 using_if_exists）解析
          # 不到 bionic 的符号，报 "reference to unresolved using declaration"。
          BINDGEN_EXTRA_CLANG_ARGS: >-
            --target=${{ matrix.target }}${{ env.ANDROID_API }}
            --sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          set -o pipefail
          cargo build \
            --profile release-dist \
            --target "${{ matrix.target }}" \
            -p obscura-cli \
            --bin obscura \
            --features "$OBSCURA_FEATURES" 2>&1 | tee "${GITHUB_WORKSPACE}/build-${{ matrix.abi }}.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.abi }}
          path: build-${{ matrix.abi }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect binary
        run: |
          BIN="obscura/target/${{ matrix.target }}/release-dist/obscura"
          test -f "$BIN"
          file "$BIN"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$BIN"
          du -h "$BIN"
          # 只打包 obscura 主程序：scrape 需要的 obscura-worker 未构建，先不支持 scrape
          mkdir -p "dist/${{ matrix.abi }}"
          cp "$BIN" "dist/${{ matrix.abi }}/libobscura.so"
          chmod 755 "dist/${{ matrix.abi }}/libobscura.so"
          sha256sum "dist/${{ matrix.abi }}/libobscura.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/libobscura.so
          # 已经是压缩过的 ELF，再压一遍没意义
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
