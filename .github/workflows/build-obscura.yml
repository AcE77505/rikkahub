name: Build Obscura (Android)

# 为 RikkaHub 交叉编译 obscura 无头浏览器（aarch64 / x86_64 Android）。
#
# 两个 job：
#   1. snapshot：在原生 arm64 / x86_64 Linux runner 上编译 obscura-js（target == host），
#      由 obscura 自己的 build.rs 生成架构正确的 OBSCURA_SNAPSHOT.bin。
#      V8 快照与架构强绑定，x86_64 host 生成的快照不能在 arm64 设备上反序列化。
#   2. build：用 satouriko/rusty-v8-mobile 的 Android 预编译 V8 静态库交叉编译
#      obscura，并通过 OBSCURA_SNAPSHOT_FILE 注入第 1 步的快照。
#
# 关键点：
#   - rusty_v8 官方没有 android 预编译库；denoland 的 linux-gnu 库在 bionic 上会缺
#     大量 glibc 符号（__errno_location/__xstat64/catopen/...）。必须用 Android 版库。
#   - satouriko 的 Android 库只有 C++ 形式的 simdutf 实现，而 deno_core 要 simdutf__*
#     C 接口；链接前用 gen_simdutf_shim.py 生成 43 个转发函数并合并进 V8 归档。
#   - 从 NDK compiler-rt 取 clear_cache.o；不要自己用 __builtin___clear_cache，
#     在 aarch64 上会编译成对 __clear_cache 的调用，导致无限递归。
#   - 删除 obscura-js 的 [build-dependencies] deno_core，避免交叉编译时为 host
#     构建 V8；快照改由 OBSCURA_SNAPSHOT_FILE 注入。

on:
  workflow_dispatch:
    inputs:
      obscura_ref:
        description: 'obscura 的 tag / 分支（例如 v0.2.7）'
        required: false
        default: 'v0.2.7'
      features:
        description: 'cargo features（render,stealth / render / 空）'
        required: false
        default: 'render,stealth'
  push:
    paths:
      - '.github/workflows/build-obscura.yml'
      - '.github/obscura/**'

permissions:
  contents: read

concurrency:
  group: build-obscura-${{ github.ref }}
  cancel-in-progress: true

env:
  OBSCURA_REF: ${{ inputs.obscura_ref || 'v0.2.7' }}
  OBSCURA_FEATURES: ${{ inputs.features || 'render,stealth' }}
  NDK_VERSION: r26d
  ANDROID_API: '29'
  V8_VERSION: '150.4.0'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  snapshot:
    name: snapshot ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            os: ubuntu-24.04-arm
            artifact: obscura-snapshot-arm64
          - label: x64
            os: ubuntu-22.04
            artifact: obscura-snapshot-x64
    steps:
      - uses: actions/checkout@v4

      - name: Check out obscura
        uses: actions/checkout@v4
        with:
          repository: h4ckf0r0day/obscura
          ref: ${{ env.OBSCURA_REF }}
          path: obscura

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev golang-go ninja-build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build obscura-js natively (generates the target-arch snapshot)
        working-directory: obscura
        run: |
          set -euo pipefail
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          # target == host：build.rs 走 native 分支，用 host V8 生成快照
          cargo build --release -p obscura-js

      - name: Collect snapshot
        run: |
          set -euo pipefail
          SNAPSHOT=$(find obscura/target/release/build \
            -path '*obscura-js*/out/OBSCURA_SNAPSHOT.bin' \
            -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          test -n "$SNAPSHOT"
          test -s "$SNAPSHOT"
          mkdir -p dist
          cp "$SNAPSHOT" dist/OBSCURA_SNAPSHOT.bin
          ls -lh dist/OBSCURA_SNAPSHOT.bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/OBSCURA_SNAPSHOT.bin
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build:
    name: obscura ${{ matrix.abi }}
    needs: snapshot
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            arch: aarch64
            snapshot_artifact: obscura-snapshot-arm64
          - target: x86_64-linux-android
            abi: x86_64
            arch: x86_64
            snapshot_artifact: obscura-snapshot-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev golang-go unzip python3 curl git ninja-build
          LIBCLANG_DIR="$(llvm-config --libdir)"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          test -e "$LIBCLANG_DIR/libclang.so"

      - name: Set up Android NDK
        run: |
          ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL -o "/tmp/${ZIP}" "https://dl.google.com/android/repository/${ZIP}"
          sudo unzip -q "/tmp/${ZIP}" -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          NDK_BIN="/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check out obscura
        uses: actions/checkout@v4
        with:
          repository: h4ckf0r0day/obscura
          ref: ${{ env.OBSCURA_REF }}
          path: obscura

      - name: Download architecture-correct V8 snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.snapshot_artifact }}
          path: snapshot

      - name: Prepare prebuilt V8 (Android) and merge shims
        run: |
          set -euo pipefail
          BASE="https://github.com/satouriko/rusty-v8-mobile/releases/download/v${V8_VERSION}"
          curl -fL -o v8.a.gz "$BASE/librusty_v8_release_${{ matrix.target }}.a.gz"
          curl -fL -o src_binding.rs "$BASE/src_binding_release_${{ matrix.target }}.rs"
          gzip -dc v8.a.gz > librusty_v8.a
          ls -lh librusty_v8.a
          echo "RUSTY_V8_ARCHIVE=$PWD/librusty_v8.a" >> "$GITHUB_ENV"
          echo "RUSTY_V8_SRC_BINDING_PATH=$PWD/src_binding.rs" >> "$GITHUB_ENV"

          mkdir -p v8shim
          cd v8shim
          "$NDK_BIN/llvm-ar" x ../librusty_v8.a simdutf.o
          "$NDK_BIN/llvm-nm" simdutf.o > simdutf.syms
          python3 "$GITHUB_WORKSPACE/.github/obscura/gen_simdutf_shim.py" simdutf.syms simdutf_shim.cc
          "$NDK_BIN/${{ matrix.target }}${ANDROID_API}-clang++" \
            -c simdutf_shim.cc -o simdutf_shim.o -O2 -fPIC -std=c++17
          "$NDK_BIN/${{ matrix.target }}${ANDROID_API}-clang++" \
            -c "$GITHUB_WORKSPACE/.github/obscura/abort_shim.cc" -o abort_shim.o -O2 -fPIC -std=c++17

          CRT=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib/clang" \
            -name "libclang_rt.builtins-${{ matrix.arch }}-android.a" | head -1)
          test -n "$CRT"
          "$NDK_BIN/llvm-ar" x "$CRT" clear_cache.c.o
          cp ../librusty_v8.a ../librusty_v8_merged.a
          "$NDK_BIN/llvm-ar" q ../librusty_v8_merged.a simdutf_shim.o abort_shim.o clear_cache.c.o
          "$NDK_BIN/llvm-ar" s ../librusty_v8_merged.a
          echo "RUSTY_V8_ARCHIVE=$PWD/../librusty_v8_merged.a" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ env.V8_VERSION }}

      - name: Patch v8 / deno_core / obscura-js for Android
        working-directory: obscura
        run: |
          set -euo pipefail
          cargo fetch --target "${{ matrix.target }}"
          V8_VER=$(awk -F'"' '/^name = "v8"$/{f=1} f&&/^version = /{print $2; exit}' Cargo.lock)
          DENO_VER=$(awk -F'"' '/^name = "deno_core"$/{f=1} f&&/^version = /{print $2; exit}' Cargo.lock)
          V8_SRC=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name "v8-$V8_VER" | head -n1)
          DENO_SRC=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name "deno_core-$DENO_VER" | head -n1)
          test -n "$V8_SRC"; test -n "$DENO_SRC"

          V8_PATCHED="$RUNNER_TEMP/v8-patched"
          DENO_PATCHED="$RUNNER_TEMP/deno_core-patched"
          cp -a "$V8_SRC" "$V8_PATCHED"
          cp -a "$DENO_SRC" "$DENO_PATCHED"

          # v8：预编译产物只对 android target 生效
          BUILD_RS="$V8_PATCHED/build.rs"
          perl -pi -e 's/if let Ok\(custom_archive\) = env::var\("RUSTY_V8_ARCHIVE"\) \{/if env::var("TARGET").map(|t| t.contains("android")).unwrap_or(false) \&\& env::var("RUSTY_V8_ARCHIVE").is_ok() { let custom_archive = env::var("RUSTY_V8_ARCHIVE").unwrap();/' "$BUILD_RS"
          perl -pi -e 's/if let Ok\(binding\) = env::var\("RUSTY_V8_SRC_BINDING_PATH"\) \{/if env::var("TARGET").map(|t| t.contains("android")).unwrap_or(false) \&\& env::var("RUSTY_V8_SRC_BINDING_PATH").is_ok() { let binding = env::var("RUSTY_V8_SRC_BINDING_PATH").unwrap();/' "$BUILD_RS"
          grep -c 't.contains("android")' "$BUILD_RS"

          # deno_core：Android 的 errno_location（bionic 用 __errno）
          TTY_RS="$DENO_PATCHED/uv_compat/tty.rs"
          perl -0pi -e 's/(  #\[cfg\(target_os = "linux"\)\]\n  fn errno_location\(\) -> \*mut c_int \{\n    unsafe extern "C" \{\n      fn __errno_location\(\) -> \*mut c_int;\n    \}\n    unsafe \{ __errno_location\(\) \}\n  \}\n)/$1\n  #[cfg(target_os = "android")]\n  fn errno_location() -> *mut c_int {\n    unsafe extern "C" {\n      fn __errno() -> *mut c_int;\n    }\n    unsafe { __errno() }\n  }\n/' "$TTY_RS"
          perl -pi -e 's/not\(any\(target_os = "macos", target_os = "linux"\)\)/not(any(target_os = "macos", target_os = "linux", target_os = "android"))/' "$TTY_RS"
          grep -q '__errno()' "$TTY_RS"

          cat >> Cargo.toml <<EOF

          # CI: 用打过补丁的 v8 / deno_core（Android 交叉编译适配）
          [patch.crates-io]
          v8 = { path = "$V8_PATCHED" }
          deno_core = { path = "$DENO_PATCHED" }
          EOF

          # obscura-js：快照改为由 OBSCURA_SNAPSHOT_FILE 注入，删除 host 侧 deno_core 依赖
          cat > crates/obscura-js/build.rs <<'RUST'
          use std::path::PathBuf;

          fn main() {
              println!("cargo:rustc-check-cfg=cfg(obscura_external_bootstrap)");
              println!("cargo:rerun-if-changed=build.rs");
              println!("cargo:rerun-if-env-changed=OBSCURA_SNAPSHOT_FILE");

              let out_dir = PathBuf::from(std::env::var("OUT_DIR").unwrap());
              let snapshot_path = out_dir.join("OBSCURA_SNAPSHOT.bin");

              // V8 快照与架构强绑定；交叉编译时由 snapshot job 注入目标架构的快照。
              let snapshot_file = std::env::var("OBSCURA_SNAPSHOT_FILE")
                  .expect("OBSCURA_SNAPSHOT_FILE must be set to an architecture-correct V8 snapshot");
              std::fs::copy(&snapshot_file, &snapshot_path)
                  .expect("Failed to copy OBSCURA_SNAPSHOT_FILE");

              println!("cargo:rustc-cfg=obscura_external_bootstrap");
              println!("cargo:rustc-env=OBSCURA_SNAPSHOT_PATH={}", snapshot_path.display());
          }
          RUST
          sed -i '/^\[build-dependencies\]$/,/^$/d' crates/obscura-js/Cargo.toml
          ! grep -q '^\[build-dependencies\]$' crates/obscura-js/Cargo.toml

      - name: Generate CMake toolchain wrapper
        run: |
          TOOLCHAIN="$RUNNER_TEMP/android-${{ matrix.abi }}.cmake"
          cat > "$TOOLCHAIN" <<EOF
          set(ANDROID_ABI "${{ matrix.abi }}" CACHE STRING "")
          set(ANDROID_PLATFORM "android-${ANDROID_API}" CACHE STRING "")
          set(ANDROID_NDK "$ANDROID_NDK_HOME" CACHE PATH "")
          include("$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake")
          EOF
          echo "CMAKE_TOOLCHAIN_FILE=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build obscura
        working-directory: obscura
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_PLATFORM: android-29
          CXXSTDLIB: c++_static
          BORING_BSSL_RUST_CPPLIB: c++_static
          GO_EXECUTABLE: /usr/bin/go
          OBSCURA_SNAPSHOT_FILE: ${{ github.workspace }}/snapshot/OBSCURA_SNAPSHOT.bin
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          TARGET_UPPER=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          export "CC_${TARGET//-/_}=$NDK_BIN/${TARGET}${ANDROID_API}-clang"
          export "CXX_${TARGET//-/_}=$NDK_BIN/${TARGET}${ANDROID_API}-clang++"
          export "AR_${TARGET//-/_}=$NDK_BIN/llvm-ar"
          export "CARGO_TARGET_${TARGET_UPPER}_LINKER=$NDK_BIN/${TARGET}${ANDROID_API}-clang"
          export "CARGO_TARGET_${TARGET_UPPER}_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384"
          export RUSTY_V8_ARCHIVE="$GITHUB_WORKSPACE/librusty_v8_merged.a"
          export RUSTY_V8_SRC_BINDING_PATH="$GITHUB_WORKSPACE/src_binding.rs"
          test -s "$OBSCURA_SNAPSHOT_FILE"
          cargo build --profile release-dist --target "$TARGET" \
            -p obscura-cli --bin obscura --features "$OBSCURA_FEATURES"

      - name: Inspect and stage binary
        run: |
          set -euo pipefail
          BIN="obscura/target/${{ matrix.target }}/release-dist/obscura"
          test -f "$BIN"
          file "$BIN"
          "$NDK_BIN/llvm-readelf" -d "$BIN" | grep NEEDED || true
          du -h "$BIN"
          mkdir -p "dist/${{ matrix.abi }}"
          cp "$BIN" "dist/${{ matrix.abi }}/libobscura.so"
          chmod 755 "dist/${{ matrix.abi }}/libobscura.so"
          sha256sum "dist/${{ matrix.abi }}"/*

      - uses: actions/upload-artifact@v4
        with:
          name: obscura-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
