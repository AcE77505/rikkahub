name: Build Obscura (Android)

# 为 RikkaHub 交叉编译 obscura 无头浏览器（aarch64 / x86_64 Android）。
#
# obscura 内嵌 V8。这里不编译 V8 源码（Android 交叉编译下 gn/bindgen 的坑很多），
# 而是直接使用 rusty_v8 官方发布的「同架构 Linux 预编译静态库 + 预生成 bindings」：
#   - 静态库只是 .o 集合，用 NDK clang 链接进 Android 可执行文件
#   - bindings 是 V8 C++ 声明的 FFI 描述，LP64 下与 Android ABI 一致
# 两者都要求与 v8 crate 同版本、同为 release、无 pointer compression。
#
# 产物：obscura-android-arm64-v8a / obscura-android-x86_64 两个 artifact，
# 各含一个 libobscura.so，下载后放进 app/src/main/jniLibs/<abi>/。

on:
  workflow_dispatch:
    inputs:
      obscura_ref:
        description: 'obscura 的 tag / 分支（例如 v0.2.7）'
        required: false
        default: 'v0.2.7'
      features:
        description: 'cargo features（render,stealth / render / 空）'
        required: false
        default: 'render,stealth'
  push:
    paths:
      - '.github/workflows/build-obscura.yml'

permissions:
  contents: read

concurrency:
  group: build-obscura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: obscura ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            linux_arch: aarch64
          - target: x86_64-linux-android
            abi: x86_64
            linux_arch: x86_64

    env:
      OBSCURA_REF: ${{ inputs.obscura_ref || 'v0.2.7' }}
      OBSCURA_FEATURES: ${{ inputs.features || 'render,stealth' }}
      # NDK r26d 与 rusty_v8 预编译库的编译环境接近
      NDK_VERSION: r26d
      ANDROID_API: '24'
      # 预编译 V8 需要 C++ 标准库；Android 用 NDK 的 libc++ 静态库
      CXXSTDLIB: c++_static
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev unzip python3 curl git
          # libclang-dev 的库在 /usr/lib/llvm-<ver>/lib；llvm-config 由 llvm-dev 提供
          LIBCLANG_DIR="$(llvm-config --libdir)"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          test -e "$LIBCLANG_DIR/libclang.so"
          clang --version
          cmake --version

      - name: Set up Android NDK
        run: |
          ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          curl -fsSL -o "/tmp/${ZIP}" "https://dl.google.com/android/repository/${ZIP}"
          sudo unzip -q "/tmp/${ZIP}" -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "/opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check out obscura
        run: |
          git clone --depth=1 --branch "$OBSCURA_REF" https://github.com/h4ckf0r0day/obscura.git obscura
          git -C obscura rev-parse HEAD

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ vars.OBSCURA_CACHE_REV || '1' }}

      - name: Prepare prebuilt V8 artifacts
        # rusty_v8 有两套构建：target（Android）和 host（build script 依赖的 v8）。
        # RUSTY_V8_ARCHIVE 是全局变量，指向单文件会害得 host 侧链接错架构
        # （rust-lld: incompatible with elf64-x86-64）。改用目录形式：build.rs 会按
        # 当前 target triple 去目录里找对应文件名，host / target 各取所需。
        run: |
          set -euo pipefail
          V8_VER=$(awk -F'"' '/^name = "v8"$/{f=1} f&&/^version = /{print $2; exit}' obscura/Cargo.lock)
          echo "v8 crate version: $V8_VER"
          ARCH="${{ matrix.linux_arch }}"
          TARGET="${{ matrix.target }}"
          BASE="https://github.com/denoland/rusty_v8/releases/download/v${V8_VER}"
          DIR="$RUNNER_TEMP/v8-archive"
          mkdir -p "$DIR"
          # target：同架构 Linux 的库/绑定，按目标 triple 命名
          curl -fL -o "$DIR/librusty_v8_release_${TARGET}.a.gz" \
            "$BASE/librusty_v8_release_${ARCH}-unknown-linux-gnu.a.gz"
          curl -fL -o "$DIR/src_binding_release_${TARGET}.rs" \
            "$BASE/src_binding_release_${ARCH}-unknown-linux-gnu.rs"
          # host（x86_64-unknown-linux-gnu）：真实 x86_64 库/绑定
          curl -fL -o "$DIR/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz" \
            "$BASE/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz"
          curl -fL -o "$DIR/src_binding_release_x86_64-unknown-linux-gnu.rs" \
            "$BASE/src_binding_release_x86_64-unknown-linux-gnu.rs"
          ls -lh "$DIR"
          gzip -t "$DIR/librusty_v8_release_${TARGET}.a.gz"
          echo "RUSTY_V8_ARCHIVE=$DIR" >> "$GITHUB_ENV"

      - name: Generate CMake toolchain wrapper
        # btls-sys 调 cmake 时会清掉环境变量，NDK toolchain 读不到 ANDROID_ABI 会回落
        # 到 armeabi-v7a（x86_64 下直接报 -march=armv7-a 不支持）。用包装文件固定 ABI。
        run: |
          TOOLCHAIN="$RUNNER_TEMP/android-${{ matrix.abi }}.cmake"
          cat > "$TOOLCHAIN" <<EOF
          set(ANDROID_ABI "${{ matrix.abi }}" CACHE STRING "")
          set(ANDROID_PLATFORM "android-${ANDROID_API}" CACHE STRING "")
          set(ANDROID_NDK "$ANDROID_NDK_HOME" CACHE PATH "")
          include("$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake")
          EOF
          cat "$TOOLCHAIN"
          echo "CMAKE_TOOLCHAIN_FILE=$TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Configure cargo linker
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat >> obscura/.cargo/config.toml <<EOF

          [target.${{ matrix.target }}]
          linker = "$NDK_BIN/${{ matrix.target }}${ANDROID_API}-clang"
          # Android 15+ 要求 16 KB 页对齐
          rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
          EOF
          cat obscura/.cargo/config.toml

      - name: Build obscura
        working-directory: obscura
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_PLATFORM: android-24
        run: |
          set -o pipefail
          cargo build \
            --profile release-dist \
            --target "${{ matrix.target }}" \
            -p obscura-cli \
            --bin obscura \
            --features "$OBSCURA_FEATURES" 2>&1 | tee "${GITHUB_WORKSPACE}/build-${{ matrix.abi }}.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.abi }}
          path: build-${{ matrix.abi }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect binary
        run: |
          BIN="obscura/target/${{ matrix.target }}/release-dist/obscura"
          test -f "$BIN"
          file "$BIN"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$BIN"
          du -h "$BIN"
          # 只打包 obscura 主程序：scrape 需要的 obscura-worker 未构建，先不支持 scrape
          mkdir -p "dist/${{ matrix.abi }}"
          cp "$BIN" "dist/${{ matrix.abi }}/libobscura.so"
          chmod 755 "dist/${{ matrix.abi }}/libobscura.so"
          sha256sum "dist/${{ matrix.abi }}/libobscura.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/libobscura.so
          # 已经是压缩过的 ELF，再压一遍没意义
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
